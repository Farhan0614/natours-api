<!DOCTYPE html>
<html>

<head>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f6f6f6;
      padding: 20px;
      color: #333;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      background-color: #ffffff;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
    }

    h1 {
      color: #55c57a;
      font-size: 24px;
    }

    p {
      font-size: 16px;
      line-height: 1.5;
      margin-bottom: 20px;
    }

    .btn {
      background-color: #55c57a;
      color: #ffffff;
      padding: 12px 25px;
      text-decoration: none;
      border-radius: 5px;
      display: inline-block;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Password Reset Request</h1>
    <p>Hi {{FIRST_NAME}},</p>
    <p>Forgot your password? Click the button below to set up a new one. This link is valid for 10 minutes.</p>
    <a href="{{URL}}" class="btn" style="color: white;">Reset Your Password</a>
    <p>If you didn't request a password reset, please safely ignore this email.</p>
  </div>
</body>

</html>
